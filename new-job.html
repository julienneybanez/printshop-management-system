<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Print Job • PaPrint</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/pages/new-job.css">
</head>
<body>
  <div class="shell">
    <aside id="sidebar"></aside>

    <main class="main">
      <header id="topbar"></header>

      <section class="page">
        <header class="page-heading">
          <span class="step-label">Step 1 of 2</span>
          <h1>Create a print job</h1>
          <p>Enter the customer and print details.</p>
        </header>

        <form id="jobForm" class="job-layout" novalidate>
          <div class="job-sections">
            <section class="card card-pad">
              <div class="section-heading">
                <h2>Customer details</h2>
              </div>

              <div class="form-grid">
                <div class="field">
                  <label for="customerName">Customer name</label>
                  <input class="input" id="customerName" type="text" autocomplete="name" required placeholder="e.g. Maria Santos">
                </div>

                <div class="field">
                  <label for="contact">Contact number</label>
                  <input class="input" id="contact" type="tel" inputmode="tel" required placeholder="09xx xxx xxxx">
                </div>
              </div>
            </section>

            <section class="card card-pad">
              <div class="section-heading">
                <h2>Print specifications</h2>
              </div>

              <div class="form-grid" style="margin-bottom:17px">
                <div class="field field-full">
                  <label for="service">Service</label>
                  <select id="service" required></select>
                </div>
              </div>

              <div class="service-fields" id="serviceFields"></div>

              <div class="form-grid" style="margin-top:17px">
                <div class="field field-full">
                  <label class="check-row" for="rush">
                    <input id="rush" type="checkbox">
                    Rush job (+ ₱20)
                  </label>
                  <div class="helper">Rush orders are prioritized.</div>
                </div>

                <div class="field field-full">
                  <label for="notes">Notes</label>
                  <textarea id="notes" placeholder="Add instructions..."></textarea>
                </div>
              </div>
            </section>
          </div>

          <aside class="card card-pad price-card">
            <div class="section-heading">
              <h2>Estimated price</h2>
            </div>

            <div class="summary-row">
              <span>Service</span>
              <strong data-base-price>₱0.00</strong>
            </div>

            <div class="summary-row">
              <span>Finishing</span>
              <strong data-finishing-fee>₱0.00</strong>
            </div>

            <div class="summary-row">
              <span>Rush fee</span>
              <strong data-rush-fee>₱0.00</strong>
            </div>

            <div class="summary-row">
              <span>Estimated total</span>
              <strong class="total" data-total>₱0.00</strong>
            </div>

            <button class="btn btn-primary" type="submit" style="width:100%;margin-top:16px">
              Review Order →
            </button>
          </aside>
        </form>
      </section>

    </main>
  </div>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/pricing.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/new-job.js"></script>
</body>
</html>
