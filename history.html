<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History • PaPrint</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/pages/history.css">
</head>
<body>
  <div class="shell">
    <aside id="sidebar"></aside>

    <main class="main">
      <header id="topbar"></header>

      <section class="page">
        <header class="page-heading">
          <h1>Completed and cancelled jobs</h1>
        </header>

        <section class="card card-pad history-toolbar">
          <div class="grid grid-2">
            <div class="field">
              <label for="historySearch">Search history</label>
              <input class="input" id="historySearch" type="search" placeholder="Queue no., customer, service...">
            </div>

            <div class="field">
              <label for="historyStatus">Status</label>
              <select id="historyStatus">
                <option value="all">All</option>
                <option value="claimed">Claimed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
          </div>
          <div class="grid grid-2" style="margin-top:12px"><div class="field"><label for="historyService">Service</label><select id="historyService"><option value="all">All services</option></select></div><div class="field"><label for="historyFrom">From</label><input class="input" type="date" id="historyFrom"></div><div class="field"><label for="historyTo">To</label><input class="input" type="date" id="historyTo"></div><button class="btn btn-neutral" type="button" id="historyReset">Reset filters</button></div>
        </section>

        <section class="card">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Queue</th>
                  <th>Customer</th>
                  <th>Service</th>
                  <th>Created</th>
                  <th>Status</th>
                  <th>Total</th><th>Actions</th>
                </tr>
              </thead>
              <tbody data-history-body></tbody>
            </table>
          </div>
        </section>
      </section>

    </main>
  </div>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/pricing.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/history.js"></script>
</body>
</html>
